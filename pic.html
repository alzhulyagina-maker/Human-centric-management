<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Радар-диаграмма ролей лидера</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .radar-container {
            width: 100%;
            max-width: 850px;
            height: 100%;
            max-height: 650px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 20px;
        }
        svg {
            width: 100%;
            height: 100%;
        }
        .node-group {
            cursor: pointer;
        }
        .node-circle {
            transition: r 0.25s ease, fill 0.25s ease, stroke-width 0.25s ease;
        }
        .node-group:hover .node-circle {
            r: 15px;
            fill: #0369a1;
            stroke: #e0f2fe;
            stroke-width: 4px;
        }
        .node-text-main {
            font-size: 15px;
            font-weight: 700;
            fill: #0f172a;
            transition: fill 0.2s ease;
        }
        .node-text-sub {
            font-size: 12px;
            font-weight: 600;
            fill: #64748b;
        }
        .node-group:hover .node-text-main {
            fill: #0284c7;
        }
        .web-line {
            stroke: #e2e8f0;
            stroke-width: 1.5;
            fill: none;
        }
        .axis-line {
            stroke: #cbd5e1;
            stroke-width: 1.5;
            stroke-dasharray: 4 4;
            fill: none;
        }
    </style>
</head>
<body>

<div class="radar-container">
    <!-- ИСПРАВЛЕНО: Сбалансированный viewBox, дающий огромный запас места по бокам -->
    <svg viewBox="-210 -50 820 500" preserveAspectRatio="xMidYMid meet" xmlns="http://w3.org">
        
        <!-- ГРАФИЧЕСКИЙ ХАК: Сжали радиус кругов паутины на 15%, чтобы отодвинуть точки от краев текста -->
        <circle cx="200" cy="200" r="135" class="web-line" />
        <circle cx="200" cy="200" r="90" class="web-line" />
        <circle cx="200" cy="200" r="45" class="web-line" />
        
        <!-- Компактные направляющие оси -->
        <line x1="200" y1="200" x2="200" y2="65" class="axis-line" />
        <line x1="200" y1="200" x2="328" y2="159" class="axis-line" />
        <line x1="200" y1="200" x2="279" y2="309" class="axis-line" />
        <line x1="200" y1="200" x2="121" y2="309" class="axis-line" />
        <line x1="200" y1="200" x2="72" y2="159" class="axis-line" />
        
        <!-- Центральное темное ядро -->
        <circle cx="200" cy="200" r="15" fill="#0f172a" />
        <text x="200" y="206" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">★</text>
        
        <!-- ТОЧКИ И ПОЛНЫЕ ОДНОСТРОЧНЫЕ НАДПИСИ (ТЕПЕРЬ НИЧЕГО НЕ РЕЖЕТ) -->
        
        <!-- Роль 5: Лидер изменений (Сверху) -->
        <g class="node-group">
            <circle cx="200" cy="65" r="11" fill="#0284c7" class="node-circle" />
            <text x="200" y="35" text-anchor="middle" class="node-text-main">Лидер изменений</text>
            <text x="200" y="95" text-anchor="middle" class="node-text-sub">Дашборды и пульс-отчеты</text>
        </g>

        <!-- Роль 1: Осознанный студент (Справа сверху) -->
        <g class="node-group">
            <circle cx="328" cy="159" r="11" fill="#0284c7" class="node-circle" />
            <text x="348" y="155" text-anchor="start" class="node-text-main">Осознанный студент</text>
            <text x="348" y="175" text-anchor="start" class="node-text-sub">Микрообучение в чате</text>
        </g>

        <!-- Роль 2: Поддерживающий наставник (Справа снизу) -->
        <g class="node-group">
            <circle cx="279" cy="309" r="11" fill="#0284c7" class="node-circle" />
            <text x="299" y="312" text-anchor="start" class="node-text-main">Поддерживающий наставник</text>
            <text x="299" y="332" text-anchor="start" class="node-text-sub">Встречи 1-на-1</text>
        </g>

        <!-- Роль 4: Стратегический партнер (Слева снизу — ПОЛНАЯ СТРОКА) -->
        <g class="node-group">
            <circle cx="121" cy="309" r="11" fill="#0284c7" class="node-circle" />
            <text x="101" y="312" text-anchor="end" class="node-text-main">Стратегический партнер</text>
            <text x="101" y="332" text-anchor="end" class="node-text-sub">KPI и метрики</text>
        </g>

        <!-- Роль 3: Стратегический переговорщик (Слева сверху — ПОЛНАЯ СТРОКА) -->
        <g class="node-group">
            <circle cx="72" cy="159" r="11" fill="#0284c7" class="node-circle" />
            <text x="52" y="155" text-anchor="end" class="node-text-main">Стратегический переговорщик</text>
            <text x="52" y="175" text-anchor="end" class="node-text-sub">Выгрузка головы</text>
        </g>

    </svg>
</div>

</body>
</html>
