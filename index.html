<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управленческие 36,6</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            max-width: 600px;
            width: 100%;
            padding: 30px;
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            color: #1a1a1a;
            margin-top: 0;
            margin-bottom: 25px;
        }
        .thermometer-container {
            background: #eef2f5;
            border-radius: 10px;
            height: 20px;
            width: 100%;
            position: relative;
            overflow: hidden;
            margin-bottom: 15px;
            border: 1px solid #e0e0e0;
        }
        .thermometer-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(to left, #ff4d4d, #ffa500, #2ecc71);
            transition: width 0.5s ease;
            float: right;
        }
        .status-text {
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 25px;
            color: #ff4d4d;
            transition: color 0.3s;
        }
        .dialog-box {
            background-color: #f0f4f8;
            border-left: 4px solid #0056b3;
            padding: 20px;
            border-radius: 4px;
            margin-bottom: 25px;
        }
        .author {
            font-weight: bold;
            color: #0056b3;
            margin-bottom: 8px;
        }
        .text {
            color: #333;
            line-height: 1.5;
            font-size: 15px;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option-btn {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px 20px;
            text-align: left;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #333;
            line-height: 1.4;
        }
        .option-btn:hover {
            background-color: #f8fafc;
            border-color: #b0b0b0;
        }
        .feedback {
            margin-top: 15px;
            padding: 15px;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.4;
            display: none;
        }
        .feedback.error {
            background-color: #ffe6e6;
            color: #cc0000;
            border: 1px solid #ffa6a6;
        }
        .feedback.success {
            background-color: #e6ffe6;
            color: #008000;
            border: 1px solid #a6ffa6;
        }
        .next-btn {
            display: none;
            margin: 20px auto 0 auto;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .next-btn:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Управленческие 36,6</h1>
    
    <div class="thermometer-container">
        <div id="bar" class="thermometer-bar"></div>
    </div>
    <div id="status" class="status-text">Лихорадка контроля: 40°C</div>

    <div class="dialog-box">
        <div id="author" class="author">Максим</div>
        <div id="dialog-text" class="text">Загрузка...</div>
    </div>

    <div id="options" class="options-container"></div>
    <div id="feedback-box" class="feedback"></div>
    <button id="next-button" class="next-btn" onclick="nextStage()">Идем дальше</button>
</div>

<script>
    const stages = [
        {
            status: "Лихорадка контроля: 40°C",
            color: "#ff4d4d",
            barWidth: "100%",
            author: "Максим",
            text: "Управленческий градусник застрял на отметке 40°C, а команда дергает по каждому чиху. В лонгридах пишут: «делегируй и доверяй». На практике с новичками этот подход не работает: возникают ошибки, и работа встает. Расскажу первый лайфхак под названием «Индекс тишины»: выберите действие для снижения контроля при сохранении безопасности.",
            options: [
                { 
                    text: "Руководитель запретил команде писать в личку чаще двух раз в день и установил жесткие часы приема вопросов.", 
                    isCorrect: false, 
                    feedback: "Это жесткое решение. Новички испугаются, затаятся, а к вечеру принесут гору нерешенных проблем и сорвут дедлайн. Температура контроля взлетит до 41°C: выберите другой вариант." 
                },
                { 
                    text: "Руководитель назначил ежедневные утренние созвоны для отчетов по задачам на день.", 
                    isCorrect: false, 
                    feedback: "Это классический микроменеджмент в обертке зум-созвона. Час времени уходит на выслушивание чужих планов, а затем руководитель все равно перепроверяет задачи. Лайфхак тоньше: измените структуру самого запроса." 
                },
                { 
                    text: "Руководитель запретил сотрудникам приносить проблемы без готового варианта решения.", 
                    isCorrect: true, 
                    feedback: "Соль лайфхака — руководитель запретил приносить «голые» проблемы. Теперь на одну проблему сотрудник предлагает два варианта решения и делает выбор. Даже если новичок предлагает глупость, мозг переключается из режима потребителя в режим аналитика. Индекс тишины в личке вырастает на 60%, а сотрудники думают самостоятельно. Контроль плавно опускается." 
                }
            ]
        },
        {
            status: "Скрытая поддержка: 38°C",
            color: "#ffa500",
            barWidth: "50%",
            author: "Максим",
            text: "При росте команды до 38°C у руководителя появляется ложная иллюзия контроля. Контроль становится скрытым, ведь leader боится отпустить вожжи. Для проверки автономии применяется «Тест на радиомолчание»: определите алгоритм этого метода.",
            options: [
                { 
                    text: "Руководитель перестает сам писать в чат и ждет, пока сотрудники первые проявят инициативу.", 
                    isCorrect: false, 
                    feedback: "В чате сотрудники имитируют работу годами. Процессам требуется прямой стресс-тест: выберите другой вариант." 
                },
                { 
                    text: "Руководитель устраивает внезапную жесткую проверку отчетов за прошлый месяц без предупреждения.", 
                    isCorrect: false, 
                    feedback: "Это не тест на автономию, это обыск. Команда поймет, что руководитель не верит. Атмосфера накалится, люди спрячут косяки. Это шаг назад: выберите другой вариант." 
                },
                { 
                    text: "Руководитель не предупреждает о форс-мажорах и уходит в полный офлайн на 2-3 дня среди рабочей недели.", 
                    isCorrect: true, 
                    feedback: "В точку. Руководитель называет это управленческим экспериментом. Двухдневный отъезд на стратегическую сессию или мини-отпуск сопровождается выключением уведомлений. За 48 часов без контроля проект не встал, клиенты не ушли, а команда сама разрулила текущие сбои — показатели в норме." 
                }
            ]
        },
        {
            status: "Здоровая норма: 36,6°C",
            color: "#2ecc71",
            barWidth: "15%",
            author: "Максим",
            text: "Финальный этап. Для выхода на чистые 36,6°C руководитель передает команде право принимать решения без согласования. Главный страх лидера — убытки из-за чужих ошибок. Для преодоления этого барьера применяется «Управленческое завещание»: определите цель инструмента.",
            options: [
                { 
                    text: "Инструкция, какими обязанностями и ответственностью обладает сотрудник для жесткого контроля действий сотрудника.", 
                    isCorrect: false, 
                    feedback: "Должностные инструкции вызывают скуку и провоцируют бюрократию при сбоях. Бумажные правила не учат самостоятельности: найдите гибкий управленческий инструмент." 
                },
                { 
                    text: "Инструкция, в каких границах и на какие суммы команда принимает решения без согласования с руководителем.", 
                    isCorrect: true, 
                    feedback: "Верно, матрица рисков и цена ошибки — основа этого инструмента. При стоимости ошибки до 100 000 рублей команда принимает решения самостоятельно. Руководитель подключается только при стратегических рисках или угрозе репутации. Четкие границы автономности мотивируют сотрудников и освобождают личное время для формирования стратегии." 
                }
            ]
        },
        {
            status: "36,6°C — Здоровая автономия достигнута!",
            color: "#2ecc71",
            barWidth: "0%",
            author: "Максим",
            text: "Поздравляю. Кулуарные лайфхаки работают. Лихорадка контроля ушла, микроменеджмент остыл, а команда вышла на уровень безопасной автономии. Теперь свободное время принадлежит стратегии.",
            options: []
        }
    ];
    let currentStageIndex = 0;

    function renderStage() {
        const stage = stages[currentStageIndex];
        
        const bar = document.getElementById("bar");
        bar.style.width = stage.barWidth;
        
        const statusText = document.getElementById("status");
        statusText.innerText = stage.status;
        statusText.style.color = stage.color;
        
        document.getElementById("author").innerText = stage.author;
        document.getElementById("dialog-text").innerText = stage.text;
        
        const optionsContainer = document.getElementById("options");
        optionsContainer.innerHTML = "";
        
        const feedbackBox = document.getElementById("feedback-box");
        feedbackBox.style.display = "none";
        
        const nextBtn = document.getElementById("next-button");
        nextBtn.style.display = "none";

        if (stage.options.length === 0) {
            nextBtn.innerText = "Пройти заново";
            nextBtn.style.display = "block";
            nextBtn.onclick = resetGame;
            return;
        } else {
            nextBtn.innerText = "Идем дальше";
            nextBtn.onclick = nextStage;
        }

        stage.options.forEach((option, index) => {
            const button = document.createElement("button");
            button.className = "option-btn";
            button.innerText = option.text;
            button.onclick = () => checkAnswer(index);
            optionsContainer.appendChild(button);
        });
    }

    function checkAnswer(optionIndex) {
        const stage = stages[currentStageIndex];
        const option = stage.options[optionIndex];
        const feedbackBox = document.getElementById("feedback-box");
        
        feedbackBox.style.display = "block";
        
        if (option.isCorrect) {
            feedbackBox.className = "feedback success";
            feedbackBox.innerText = option.feedback;
            document.getElementById("next-button").style.display = "block";
            
            const buttons = document.querySelectorAll(".option-btn");
            buttons.forEach(btn => btn.disabled = true);
        } else {
            feedbackBox.className = "feedback error";
            feedbackBox.innerText = option.feedback;
        }
    }

    function nextStage() {
        currentStageIndex++;
        if (currentStageIndex < stages.length) {
            renderStage();
        }
    }

    function resetGame() {
        currentStageIndex = 0;
        renderStage();
    }

    renderStage();
</script>

</body>
</html>
